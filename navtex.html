        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 10; }
        
        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);

        ::-webkit-scrollbar { width: 4px; }

        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Leaflet Marker Tweaks */
        .leaflet-custom-marker-wrap {
            background: transparent; border: none; display: flex; align-items: center; justify-content: center; overflow: visible;
        }

        .navtex-marker {
            background-color: white; border: 2px solid #0f172a; border-radius: 8px; padding: 4px 8px;
            font-size: 11px; font-weight: 700; color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex; align-items: center; gap: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: default; white-space: nowrap; width: max-content;
        }
        .dark .navtex-marker {
            background-color: #1e293b; border-color: #cbd5e1; color: #f8fafc;
        }
        
        .navtex-marker:hover { z-index: 800 !important; transform: translateY(-2px) scale(1.05); }

        .navtex-marker.active {
            background-color: #ef4444; border-color: #7f1d1d; color: white; transform: scale(1.1); z-index: 999 !important;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
        }
        .dark .navtex-marker.active {
            border-color: #fca5a5;
        }
        
        .marker-letter {
            background: #0f172a; color: white; border-radius: 4px; width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
        }
        .dark .marker-letter { background: #cbd5e1; color: #0f172a; }
        .navtex-marker.active .marker-letter { background: white; color: #ef4444; }

        .sr-only-copy { position: absolute; left: -9999px; top: -9999px; opacity: 0; }
        
        /* Leaflet UI Overrides */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1) !important; border-radius: 8px !important; overflow: hidden; }

        .dark .leaflet-control-zoom a { background-color: rgba(30,41,59,0.9) !important; color: #f8fafc !important; }
        .dark .leaflet-control-zoom a:hover { background-color: #334155 !important; }
        
        /* Toast Animation */
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        }

        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            if (isDark) {
                themeIconDark.classList.add('hidden');
                themeIconLight.classList.remove('hidden');
            } else {
                themeIconLight.classList.add('hidden');
                themeIconDark.classList.remove('hidden');

        // Custom Toast Notification System
        function showNotification(message, type = 'info') {
            const container = document.getElementById('toast-container') || (() => {
                const c = document.createElement('div');
                c.id = 'toast-container';
                c.className = 'fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none';
                document.body.appendChild(c);
                return c;
            })();

            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-emerald-500' : 'bg-slate-800');
            const icon = type === 'error' ? 'alert-octagon' : (type === 'success' ? 'check-circle' : 'info');
            
            toast.className = `toast-enter flex items-center gap-3 ${bg} text-white px-4 py-3 rounded-xl shadow-2xl pointer-events-auto font-medium text-sm`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 opacity-90"></i> ${message}`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.transition = 'all 0.4s ease';
                toast.style.opacity = '0';

        function parseRTZ(xmlStr) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlStr, "text/xml");
            const waypoints = xmlDoc.getElementsByTagName("waypoint");
            const coords = [];
            
            for (let i = 0; i < waypoints.length; i++) {
                const pos = waypoints[i].getElementsByTagName("position")[0];
                if (pos) {
                    const lat = parseFloat(pos.getAttribute("lat"));
                    const lon = parseFloat(pos.getAttribute("lon"));
                    if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
                }
            }
            return coords;
        }

        // Robust parser handling DD, DMM, DMS formats across messy text files
        function parseUniversalCoords(text) {
            const coords = [];
            const lines = text.split('\n');
            
            // Matches components: degrees, optional minutes, optional seconds, Direction
            // e.g., 34.5 N, 34 30 N, 34°30'0"N
            const complexRegex = /([+-]?\d+(?:\.\d+)?)[^\dA-Za-z]*?(?:(\d+(?:\.\d+)?)[^\dA-Za-z]*?)?(?:(\d+(?:\.\d+)?)[^\dA-Za-z]*?)?([NSEW])/gi;

            lines.forEach(line => {
                let matches = [...line.matchAll(complexRegex)];
                if (matches.length >= 2) {
                    let lat = null, lon = null;
                    
                    // Process the first two directional matches found on the line
                    for(let i=0; i<2; i++) {
                        let deg = parseFloat(matches[i][1]) || 0;
                        let min = parseFloat(matches[i][2]) || 0;
                        let sec = parseFloat(matches[i][3]) || 0;
                        let dir = matches[i][4].toUpperCase();
                        
                        let decimal = Math.abs(deg) + (min / 60) + (sec / 3600);
                        if (deg < 0) decimal = -decimal; // Handle cases where negative sign is explicitly written
                        
                        if (dir === 'S' || dir === 'W') decimal = -decimal;

                        if (dir === 'N' || dir === 'S') lat = decimal;
                        if (dir === 'E' || dir === 'W') lon = decimal;
                    }
                    
                    if (lat !== null && lon !== null && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                        coords.push([lon, lat]);
                    }
                } else {
                    // Fallback to basic comma/space separated decimal values (e.g., "34.1234, -118.5678")
                    const basicRegex = /(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/g;
                    const basicMatch = basicRegex.exec(line);
                    if (basicMatch) {
                        let val1 = parseFloat(basicMatch[1]);
                        let val2 = parseFloat(basicMatch[2]);
                        
                        // Infer Lat/Lon by realistic bounds (Lat is max 90, Lon is max 180)
                        if (Math.abs(val1) <= 90 && Math.abs(val2) <= 180 && (Math.abs(val2) > 90 || Math.abs(val1) < Math.abs(val2))) {
                            coords.push([val2, val1]); // [lon, lat]
                        } else if (Math.abs(val2) <= 90 && Math.abs(val1) <= 180) {
                             coords.push([val1, val2]);
                        }
                    }
                }
            });
            return coords;
        }

        function processVoyageRoute(coordinates) {
            if (routeLayer) map.removeLayer(routeLayer);

            const lineString = turf.lineString(coordinates);
            
            // Draw Route with Theme-Aware Color
            const isDark = document.documentElement.classList.contains('dark');
            const routeColor = isDark ? '#38bdf8' : '#0f172a';

            routeLayer = L.geoJSON(lineString, {
                style: { color: routeColor, weight: 4, dashArray: '8, 8', lineCap: 'round' }
            }).addTo(map);

            // Animate map fit bounds
            map.flyToBounds(routeLayer.getBounds(), { padding: [100, 100], maxZoom: 7, duration: 1.5 });

            document.getElementById('clear-btn').classList.remove('hidden');

            const affectedStations = [];
            
            navtexStations.forEach(station => {
                const pt = turf.point([station.lng, station.lat]);
                const distance = turf.pointToLineDistance(pt, lineString, { units: 'nauticalmiles' });
                
                if (distance <= station.range) {
                    affectedStations.push({ ...station, distanceToRoute: distance.toFixed(1) });
                }
            });

            // Sort purely by Distance for better operational sense
            affectedStations.sort((a, b) => parseFloat(a.distanceToRoute) - parseFloat(b.distanceToRoute));

            drawNavtexMap(affectedStations.map(s => s.id));
            renderSidebarList(affectedStations);
        }

            copyBtn.classList.remove('hidden');

            stations.forEach(st => {
                copyText += `[${st.b1}] ${st.name} (${st.country}) - ${st.distanceToRoute} NM\n`;

                const div = document.createElement('div');
                const distancePercent = Math.min((st.distanceToRoute / st.range) * 100, 100);
                const barColor = distancePercent < 25 ? 'bg-red-500' : (distancePercent < 60 ? 'bg-amber-400' : 'bg-emerald-500');

                div.className = "group relative bg-white dark:bg-slate-800 p-4 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:shadow-md hover:border-primary/50 dark:hover:border-sky-500/50 transition-all cursor-pointer";
                div.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="flex flex-col items-center justify-center w-10 h-10 rounded-lg bg-secondary dark:bg-slate-700 text-white shadow-inner">
                                <span class="text-xs font-semibold opacity-70 leading-none mb-0.5">ID</span>
                                <span class="font-extrabold text-lg leading-none">${st.b1}</span>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200 leading-tight">${st.name}</h3>
                                <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-0.5 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> ${st.country}
                                </p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-0.5">Closest Pt</p>
                            <p class="text-sm font-black text-secondary dark:text-sky-400">${st.distanceToRoute} <span class="text-[10px] text-slate-500 font-semibold">NM</span></p>
                        </div>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-1.5 overflow-hidden">
                        <div class="h-1.5 ${barColor} rounded-full transition-all duration-1000 ease-out" style="width: 0%" data-target-width="${100 - distancePercent}%"></div>
                    </div>
                `;
                
                // Click to focus map on station
                div.addEventListener('click', () => {
                    map.flyTo([st.lat, st.lng], 7, { duration: 1 });
                });

                listContainer.appendChild(div);
            });

            // Animate progress bars
            setTimeout(() => {
                document.querySelectorAll('#affected-list [data-target-width]').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-target-width');
                });
            }, 100);

            copyArea.value = copyText.trim();
            lucide.createIcons();
        }

        document.getElementById('copy-btn').addEventListener('click', function() {
            const copyArea = document.getElementById('copy-area');
            copyArea.select();
            copyArea.setSelectionRange(0, 99999); 
            
            try {
                document.execCommand('copy');
                const btn = document.getElementById('copy-btn');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check-check" class="w-3.5 h-3.5"></i> Copied`;
                
                btn.classList.replace('text-slate-700', 'text-emerald-700');
                btn.classList.replace('dark:text-slate-300', 'dark:text-emerald-400');
                btn.classList.add('bg-emerald-50', 'dark:bg-emerald-900/30', 'border-emerald-200', 'dark:border-emerald-800');
                lucide.createIcons();
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.replace('text-emerald-700', 'text-slate-700');
                    btn.classList.replace('dark:text-emerald-400', 'dark:text-slate-300');
                    btn.classList.remove('bg-emerald-50', 'dark:bg-emerald-900/30', 'border-emerald-200', 'dark:border-emerald-800');
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                showNotification('Failed to copy. Please try again.', 'error');
            }
        });

        function resetApp() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            
            drawNavtexMap([]); 
            
            document.getElementById('station-count').innerText = '0';
            document.getElementById('copy-btn').classList.add('hidden');
            document.getElementById('copy-area').value = "";
            document.getElementById('affected-list').innerHTML = `
                <div class="text-center py-10 px-4">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-slate-100 dark:bg-slate-700 shadow-inner mb-4">
                        <i data-lucide="navigation" class="w-6 h-6 text-slate-400 dark:text-slate-500"></i>
                    </div>
                    <p class="text-base font-semibold text-slate-700 dark:text-slate-200">Ready to Analyze</p>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-[250px] mx-auto leading-relaxed">Upload your route waypoint data to identify NAVTEX stations within a 400 NM radius.</p>
                </div>
            `;
            document.getElementById('route-upload').value = '';
            document.getElementById('clear-btn').classList.add('hidden');
            lucide.createIcons();
            
            map.flyTo([-2.0, 118.0], 5, { duration: 1.5 });
        }

        document.getElementById('clear-btn').addEventListener('click', resetApp);
    </script>
</body>
</html>
